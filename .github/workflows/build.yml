name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compilar, testar e gerar o .jar
        run: ./gradlew build --no-daemon

      - name: Publicar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: chrono_bubble
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publicar o relatorio dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
